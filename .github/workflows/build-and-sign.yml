name: Build & Sign Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.19.0-alpha)"
        required: true
  # Disabled until code signing is set up — re-enable when Certum cert is purchased.
  # push:
  #   tags:
  #     - "v*"

env:
  GODOT_VERSION: "4.7"
  EXPORT_PRESET: "Windows Desktop"
  GAME_NAME: "ChainRevival"

jobs:
  build:
    name: Export Windows Build
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7-stable
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup export directory
        run: mkdir -p build/windows

      - name: Import Godot assets
        run: godot --headless --import 2>&1 || true

      - name: Export Windows build
        run: |
          godot --headless --export-release \
            "${{ env.EXPORT_PRESET }}" \
            build/windows/${{ env.GAME_NAME }}.exe

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: build/windows/
          retention-days: 30

  sign:
    name: Sign with Certum SimplySign
    needs: build
    if: secrets.SIMPLYSIGN_TOTP_SEED != ''
    runs-on: windows-latest
    environment: signing
    steps:
      - name: Download unsigned build
        uses: actions/download-artifact@v4
        with:
          name: windows-unsigned
          path: build/windows/

      - name: Install Certum SimplySign
        run: |
          Invoke-WebRequest -Uri "https://simplysign.certum.eu/SimplySign_Desktop.exe" -OutFile SimplySign.exe
          Start-Process -Wait -FilePath .\SimplySign.exe -ArgumentList "/S"

      - name: Sign exe with signtool
        run: |
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"
          & $signtool sign /fd SHA256 /tr http://time.certum.pl /td SHA256 /a build/windows/${{ env.GAME_NAME }}.exe

      - name: Upload signed build
        uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: build/windows/
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [build, sign]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download signed build
        if: needs.sign.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-signed
          path: release/

      - name: Download unsigned build (fallback)
        if: needs.sign.result != 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-unsigned
          path: release/

      - name: Create release zip
        run: |
          cd release
          zip -r ../${{ env.GAME_NAME }}-${{ steps.version.outputs.version }}.zip .

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Chain Revival v${{ steps.version.outputs.version }}
          files: ${{ env.GAME_NAME }}-${{ steps.version.outputs.version }}.zip
          draft: true
          generate_release_notes: true
